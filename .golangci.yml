run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - unconvert

linters-settings:
  govet:
    enable-all: false
    disable:
      - fieldalignment
  gofmt:
    simplify: true

issues:
  exclude-dirs:
    - internal/typescriptgo/upstream
  max-issues-per-linter: 50
  max-same-issues: 10
