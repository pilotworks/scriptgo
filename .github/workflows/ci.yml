name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.vscode/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.vscode/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================================================
  # Test Matrix: Unit, Integration, Frontend & Parity Benchmarks
  # ============================================================================
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.26.x']
    env:
      SCRIPTGO_CACHE_DIR: ${{ github.workspace }}/.cache/scriptgo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache ScriptGo Runtime Objects
        uses: actions/cache@v4
        with:
          path: .cache/scriptgo
          key: scriptgo-runtime-${{ runner.os }}-${{ hashFiles('internal/runtime/**', 'internal/compiler/runtime_cache.go') }}
          restore-keys: |
            scriptgo-runtime-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Setup Node.js (for WASI execution)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Zig (for WebAssembly / WASI & Cross-Compilation)
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Setup Clang Runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libclang-rt-dev

      - name: Build scriptgo CLI
        run: go build -v ./cmd/scriptgo

      - name: Run Test Suite
        run: go test -v -count=1 ./... ./internal/typescriptgo/...

  # ============================================================================
  # Parity: Node.js vs ScriptGo Native Conformance Benchmark (Parallel Job)
  # ============================================================================
  parity:
    name: Parity Benchmark (Node.js vs Native)
    runs-on: ubuntu-latest
    env:
      SCRIPTGO_CACHE_DIR: ${{ github.workspace }}/.cache/scriptgo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache ScriptGo Runtime Objects
        uses: actions/cache@v4
        with:
          path: .cache/scriptgo
          key: scriptgo-runtime-${{ runner.os }}-${{ hashFiles('internal/runtime/**', 'internal/compiler/runtime_cache.go') }}
          restore-keys: |
            scriptgo-runtime-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node.js (for Parity Oracle)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install parity Node dependencies
        run: npm ci --prefix internal/compiler

      - name: Setup Zig (for WebAssembly / WASI & Cross-Compilation)
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Setup Clang Runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libclang-rt-dev

      - name: Run Node.js Parity Benchmark
        run: go run ./cmd/parity -v

  # ============================================================================
  # Sanitizers: AddressSanitizer & UndefinedBehaviorSanitizer (Parallel Job)
  # ============================================================================
  sanitizer:
    name: Memory & Address Sanitizer (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    env:
      SCRIPTGO_CACHE_DIR: ${{ github.workspace }}/.cache/scriptgo
      SCRIPTGO_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache ScriptGo Runtime Objects
        uses: actions/cache@v4
        with:
          path: .cache/scriptgo
          key: scriptgo-sanitizer-${{ runner.os }}-${{ hashFiles('internal/runtime/**', 'internal/compiler/runtime_cache.go') }}
          restore-keys: |
            scriptgo-sanitizer-${{ runner.os }}-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Clang Runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libclang-rt-dev

      - name: Run Native Sanitizers Check
        env:
          ASAN_OPTIONS: 'detect_leaks=0'
        run: make test-sanitizers

  # ============================================================================
  # Lint: Code style and static analysis with golangci-lint
  # ============================================================================
  lint:
    name: Lint (golangci-lint & go vet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run Go Vet
        run: make lint

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5
          install-mode: "goinstall"
          args: --timeout=5m

  # ============================================================================
  # Security: Vulnerability scan for Go dependencies
  # ============================================================================
  vulncheck:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... ./internal/typescriptgo/...
