name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================================
  # Quality Gate: Full test suite, Parity benchmark, Sanitizers & Linter
  # ============================================================================
  gate:
    name: Release Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node.js (Parity Oracle)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Clang / LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Gate 1 - Full Unit & Integration Tests
        run: go test -v -count=1 ./...

      - name: Gate 2 - TypeScript-Go Frontend Tests
        run: go test -v -count=1 ./internal/typescriptgo/...

      - name: Gate 3 - Node.js Parity Benchmark (136/136 tests)
        run: go run ./cmd/parity

      - name: Gate 4 - Native Memory Leak & Address Sanitizer Check
        env:
          ASAN_OPTIONS: 'detect_leaks=1'
        run: |
          mkdir -p bin_gate
          go build -o bin_gate/scriptgo ./cmd/scriptgo
          ./bin_gate/scriptgo build --sanitize address,undefined,leak examples/fibonacci.ts -o bin_gate/fib
          ./bin_gate/fib
          ./bin_gate/scriptgo build --sanitize address,undefined,leak examples/classes_oop.ts -o bin_gate/oop
          ./bin_gate/oop
          ./bin_gate/scriptgo build --sanitize address,undefined,leak examples/functional_arrays.ts -o bin_gate/arr
          ./bin_gate/arr
          rm -rf bin_gate

      - name: Gate 5 - Code Quality (Go Vet)
        run: |
          go vet ./...
          go vet ./internal/typescriptgo/...

  # ============================================================================
  # Build Matrix: Cross-compile & package archives in parallel (only if gates pass)
  # ============================================================================
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [gate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: darwin
            goarch: arm64
            archive_format: tar.gz
          - runner: ubuntu-latest
            goos: darwin
            goarch: amd64
            archive_format: tar.gz
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            archive_format: tar.gz
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            archive_format: tar.gz
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            archive_format: zip
            exe: .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build and Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BINARY_NAME="scriptgo${{ matrix.exe }}"
          PKG_NAME="scriptgo_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          
          mkdir -p build_pkg dist
          
          # Compile binary
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o "build_pkg/${BINARY_NAME}" ./cmd/scriptgo
          
          # Copy documentation
          cp LICENSE README.md build_pkg/ 2>/dev/null || true
          
          # Package archive
          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            cd build_pkg
            zip -r "../dist/${PKG_NAME}.zip" .
            cd ..
          else
            tar -czvf "dist/${PKG_NAME}.tar.gz" -C build_pkg .
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  # ============================================================================
  # Publish: Checksums, Changelog extraction, and GitHub Release creation
  # ============================================================================
  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Install Minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Prepare Manifest, Checksums & Minisign Signatures
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSPHRASE: ${{ secrets.MINISIGN_PASSPHRASE }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          
          # 1. Recreate minisign.pub directly from Secret Key
          if [ -n "$MINISIGN_SECRET_KEY" ]; then
            echo "$MINISIGN_SECRET_KEY" > minisign.key
            chmod 600 minisign.key
            minisign -R -s minisign.key -p dist/minisign.pub
          fi

          # 2. Generate release-manifest.json
          python3 - << 'EOF'
          import json, hashlib, os, datetime

          dist_dir = 'dist'
          version = os.environ.get('VERSION', '')
          tag = os.environ.get('GITHUB_REF_NAME', '')
          commit = os.environ.get('GITHUB_SHA', '')
          
          pubkey_str = ""
          pub_path = os.path.join(dist_dir, "minisign.pub")
          if os.path.exists(pub_path):
              with open(pub_path, "r") as f:
                  lines = [l.strip() for l in f if l.strip()]
                  pubkey_str = lines[-1] if lines else ""

          manifest = {
              "schema_version": "1.0",
              "project": "scriptgo",
              "version": version,
              "tag": tag,
              "commit": commit,
              "release_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "minisign_pubkey": pubkey_str,
              "assets": []
          }

          for fname in sorted(os.listdir(dist_dir)):
              if fname.startswith('.') or fname in ('release-manifest.json', 'SHA256SUMS', 'SHA256SUMS.minisig', 'checksums.txt', 'checksums.txt.minisig'):
                  continue
              fpath = os.path.join(dist_dir, fname)
              if os.path.isfile(fpath):
                  with open(fpath, 'rb') as f:
                      digest = hashlib.sha256(f.read()).hexdigest()
                  manifest['assets'].append({
                      "name": fname,
                      "size": os.path.getsize(fpath),
                      "sha256": digest
                  })

          with open(os.path.join(dist_dir, 'release-manifest.json'), 'w') as f:
              json.dump(manifest, f, indent=2)
          EOF

          # 3. Generate SHA256SUMS
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          
          # 4. Sign SHA256SUMS with Minisign
          if [ -n "$MINISIGN_SECRET_KEY" ]; then
            echo "Signing SHA256SUMS with Minisign..."
            if [ -n "$MINISIGN_PASSPHRASE" ]; then
              printf '%s\n' "$MINISIGN_PASSPHRASE" | minisign -Sm SHA256SUMS -s ../minisign.key -t "ScriptGo Release $GITHUB_REF_NAME"
            else
              minisign -Sm SHA256SUMS -s ../minisign.key -t "ScriptGo Release $GITHUB_REF_NAME"
            fi
            rm -f ../minisign.key
            echo "Successfully generated SHA256SUMS.minisig"
          else
            echo "::warning::MINISIGN_SECRET_KEY secret is not set, skipping Minisign signature generation."
          fi
          cd ..


      - name: Extract Changelog for Release Body
        id: changelog
        run: |
          python3 - << 'EOF'
          import os, re

          tag = os.environ.get("GITHUB_REF_NAME", "")
          version = tag.lstrip("v")
          
          notes = ""
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  content = f.read()
              
              pattern = rf'## \[{re.escape(version)}\][^\n]*\n([\s\S]*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content)
              if match and match.group(1).strip():
                  notes = match.group(1).strip()
          
          if not notes:
              notes = f"Release {tag}"

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          
          print("Extracted Release Notes:")
          print(notes)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

