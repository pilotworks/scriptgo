name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================================
  # Quality Gate: Full test suite, Parity benchmark, Sanitizers & Linter
  # ============================================================================
  gate:
    name: Release Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Setup Node.js (Parity Oracle)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Clang / LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Gate 1 - Full Unit & Integration Tests
        run: go test -v -count=1 ./...

      - name: Gate 2 - TypeScript-Go Frontend Tests
        run: go test -v -count=1 ./internal/typescriptgo/...

      - name: Gate 3 - Node.js Parity Benchmark (136/136 tests)
        run: go run ./cmd/parity

      - name: Gate 4 - Native Memory Leak & Address Sanitizer Check
        env:
          ASAN_OPTIONS: 'detect_leaks=1'
        run: |
          mkdir -p bin_gate
          go build -o bin_gate/scriptgo ./cmd/scriptgo
          ./bin_gate/scriptgo build --sanitize address,undefined,leak examples/fibonacci.ts -o bin_gate/fib
          ./bin_gate/fib
          ./bin_gate/scriptgo build --sanitize address,undefined,leak examples/classes_oop.ts -o bin_gate/oop
          ./bin_gate/oop
          ./bin_gate/scriptgo build --sanitize address,undefined,leak examples/functional_arrays.ts -o bin_gate/arr
          ./bin_gate/arr
          rm -rf bin_gate

      - name: Gate 5 - Code Quality & Linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ============================================================================
  # Build Matrix: Cross-compile & package archives in parallel (only if gates pass)
  # ============================================================================
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [gate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: darwin
            goarch: arm64
            archive_format: tar.gz
          - runner: ubuntu-latest
            goos: darwin
            goarch: amd64
            archive_format: tar.gz
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            archive_format: tar.gz
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            archive_format: tar.gz
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            archive_format: zip
            exe: .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Build and Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BINARY_NAME="scriptgo${{ matrix.exe }}"
          PKG_NAME="scriptgo_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          
          mkdir -p build_pkg dist
          
          # Compile binary
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o "build_pkg/${BINARY_NAME}" ./cmd/scriptgo
          
          # Copy documentation
          cp LICENSE README.md build_pkg/ 2>/dev/null || true
          
          # Package archive
          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            cd build_pkg
            zip -r "../dist/${PKG_NAME}.zip" .
            cd ..
          else
            tar -czvf "dist/${PKG_NAME}.tar.gz" -C build_pkg .
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  # ============================================================================
  # Publish: Checksums, Changelog extraction, and GitHub Release creation
  # ============================================================================
  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
          cd ..

      - name: Extract Changelog for Release Body
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Release version: $VERSION"
          
          if [ -f "CHANGELOG.md" ] && grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "Extracting release notes from CHANGELOG.md..."
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { flag=1; next }
              /^## \\[/ && flag { flag=0 }
              flag { print }
            ' CHANGELOG.md > release_notes.md
          else
            echo "Release $GITHUB_REF_NAME" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
