name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================================
  # Quality Gate: Full test suite, Parity benchmark, Sanitizers & Linter
  # ============================================================================
  gate:
    name: Release Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node.js (Parity Oracle & WASI execution)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install parity Node dependencies
        run: npm ci --prefix internal/compiler

      - name: Setup Zig (WebAssembly & Cross-Toolchain)
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Setup Clang / LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-rt-dev

      - name: Gate 1 - Full Unit & Integration Tests
        run: go test -v -count=1 ./...

      - name: Gate 2 - TypeScript-Go Frontend Tests
        run: go test -v -count=1 ./internal/typescriptgo/...

      - name: Gate 3 - Node.js Parity Benchmark
        run: go run ./cmd/parity -v

      - name: Gate 4 - Native Memory & Address Sanitizer Check
        env:
          ASAN_OPTIONS: 'detect_leaks=0'
        run: |
          mkdir -p bin_gate
          go build -ldflags="-X main.version=${GITHUB_REF_NAME}" -o bin_gate/scriptgo ./cmd/scriptgo
          ./bin_gate/scriptgo build --sanitize address,undefined examples/fibonacci.ts -o bin_gate/fib
          ./bin_gate/fib
          ./bin_gate/scriptgo build --sanitize address,undefined examples/classes_oop.ts -o bin_gate/oop
          ./bin_gate/oop
          ./bin_gate/scriptgo build --sanitize address,undefined examples/functional_arrays.ts -o bin_gate/arr
          ./bin_gate/arr
          rm -rf bin_gate

      - name: Gate 5 - Code Quality (Go Vet)
        run: |
          go vet ./...
          go vet ./internal/typescriptgo/...

  # ============================================================================
  # Build Matrix: Cross-compile & package archives in parallel (only if gates pass)
  # ============================================================================
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [gate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: darwin
            goarch: arm64
            archive_format: tar.gz
          - runner: ubuntu-latest
            goos: darwin
            goarch: amd64
            archive_format: tar.gz
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            archive_format: tar.gz
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            archive_format: tar.gz
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            archive_format: zip
            exe: .exe
          - runner: ubuntu-latest
            goos: wasip1
            goarch: wasm
            archive_format: tar.gz
            exe: .wasm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build and Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BINARY_NAME="scriptgo${{ matrix.exe }}"
          PKG_NAME="scriptgo_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          
          mkdir -p build_pkg dist
          
          # Compile binary
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "build_pkg/${BINARY_NAME}" ./cmd/scriptgo
          
          # Copy documentation
          cp LICENSE README.md build_pkg/
          
          # Package archive
          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            cd build_pkg
            zip -r "../dist/${PKG_NAME}.zip" .
            cd ..
          else
            tar -czvf "dist/${PKG_NAME}.tar.gz" -C build_pkg .
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  # ============================================================================
  # Publish: Checksums, Changelog extraction, and GitHub Release creation
  # ============================================================================
  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Install Minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Prepare Manifest, Checksums & Minisign Signatures
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY secret is required for releases."
            exit 1
          fi
          if [ -z "${MINISIGN_PUBLIC_KEY:-}" ]; then
            echo "::error::MINISIGN_PUBLIC_KEY repository variable is required for releases."
            exit 1
          fi

          # GitHub Secrets protects the passwordless CI key; temporary files are
          # restricted to the current runner and removed when the step exits.
          umask 077
          key_file="$(mktemp)"
          pub_file="$(mktemp)"
          trap 'rm -f "$key_file" "$pub_file"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key_file"
          printf '%s\n' "$MINISIGN_PUBLIC_KEY" > "$pub_file"
          cp "$pub_file" dist/minisign.pub

          # 2. Generate release-manifest.json
          python3 - << 'EOF'
          import json, hashlib, os, datetime

          dist_dir = 'dist'
          tag = os.environ.get('GITHUB_REF_NAME', '')
          version = tag.removeprefix('v')
          commit = os.environ.get('GITHUB_SHA', '')
          
          pubkey_str = ""
          pub_path = os.path.join(dist_dir, "minisign.pub")
          if os.path.exists(pub_path):
              with open(pub_path, "r") as f:
                  lines = [l.strip() for l in f if l.strip()]
                  pubkey_str = lines[-1] if lines else ""

          manifest = {
              "schema_version": "1.0",
              "project": "scriptgo",
              "version": version,
              "tag": tag,
              "commit": commit,
              "release_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "minisign_pubkey": pubkey_str,
              "assets": []
          }

          for fname in sorted(os.listdir(dist_dir)):
              if fname.startswith('.') or fname in ('release-manifest.json', 'SHA256SUMS', 'SHA256SUMS.minisig', 'checksums.txt', 'checksums.txt.minisig'):
                  continue
              fpath = os.path.join(dist_dir, fname)
              if os.path.isfile(fpath):
                  with open(fpath, 'rb') as f:
                      digest = hashlib.sha256(f.read()).hexdigest()
                  manifest['assets'].append({
                      "name": fname,
                      "size": os.path.getsize(fpath),
                      "sha256": digest
                  })

          with open(os.path.join(dist_dir, 'release-manifest.json'), 'w') as f:
              json.dump(manifest, f, indent=2)
          EOF

          # 3. Generate SHA256SUMS
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          
          # 4. Sign and immediately verify SHA256SUMS with Minisign
          echo "Signing SHA256SUMS with Minisign..."
          minisign -Sm SHA256SUMS -s "$key_file" -t "ScriptGo Release $GITHUB_REF_NAME"
          minisign -Vm SHA256SUMS -p "$pub_file"
          echo "Successfully generated and verified SHA256SUMS.minisig"
          cd ..


      - name: Extract Changelog for Release Body
        id: changelog
        run: |
          python3 - << 'EOF'
          import os, re

          tag = os.environ.get("GITHUB_REF_NAME", "")
          version = tag.lstrip("v")
          
          notes = ""
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  content = f.read()
              
              pattern = rf'## \[{re.escape(version)}\][^\n]*\n([\s\S]*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content)
              if match and match.group(1).strip():
                  notes = match.group(1).strip()
          
          if not notes:
              notes = f"Release {tag}"

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          
          print("Extracted Release Notes:")
          print(notes)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
